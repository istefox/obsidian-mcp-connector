<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MCP Connector spike</title>
    <style>
      /* Everything is inline: the host renders this in a sandboxed iframe
         with a deny-by-default CSP, so an external stylesheet or font
         would simply not load. */
      body {
        margin: 0;
        padding: 16px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1d1d1f;
        background: #f5f5f7;
      }
      .card {
        max-width: 420px;
        padding: 16px 18px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid #d9d9de;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #4b4b52;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>MCP Connector: UI resource rendered</h1>
      <p>
        If you can read this inside the conversation, the host fetched
        <code>ui://mcp-connector/spike</code> over <code>resources/read</code> and
        rendered it. That is the whole question this page exists to answer.
      </p>
      <p id="status">handshake: not started</p>
    </div>
    <script>
      // A view is an MCP client speaking JSON-RPC over postMessage. The
      // host MUST NOT interact with it before `ui/notifications/initialized`
      // arrives, so a page that never handshakes is a page the host keeps
      // blank — which is exactly what round two showed.
      (function () {
        var status = document.getElementById("status");
        var say = function (text) {
          status.textContent = "handshake: " + text;
        };
        var send = function (message) {
          window.parent.postMessage(message, "*");
        };

        window.addEventListener("message", function (event) {
          var data = event.data;
          if (!data || data.id !== 1) return;
          say(data.error ? "refused by host" : "complete");
          send({
            jsonrpc: "2.0",
            method: "ui/notifications/initialized",
            params: {},
          });
          // Reported so a host laying out a flexible container gives the
          // view a real height instead of a collapsed one.
          send({
            jsonrpc: "2.0",
            method: "ui/notifications/size-changed",
            params: {
              width: document.body.scrollWidth,
              height: document.body.scrollHeight,
            },
          });
        });

        say("ui/initialize sent");
        send({
          jsonrpc: "2.0",
          id: 1,
          method: "ui/initialize",
          params: { appCapabilities: {} },
        });
      })();
    </script>
  </body>
</html>
