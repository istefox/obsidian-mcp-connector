<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Search results</title>
    <style>
      /* Everything inline: the host renders this in a sandboxed iframe
         with a deny-by-default CSP, so an external stylesheet, font or
         script would simply not load. Every colour is a host CSS
         variable with a local fallback, so a host that sends no theme
         still matches the surrounding OS preference (ADR-0018 D8). */
      :root {
        --sr-fallback-bg-primary: #ffffff;
        --sr-fallback-bg-secondary: #f4f5f6;
        --sr-fallback-text-primary: #16181d;
        --sr-fallback-text-secondary: #4b4f56;
        --sr-fallback-text-tertiary: #767b83;
        --sr-fallback-border-primary: #d7dade;
        --sr-fallback-border-warning: #d9a441;
        --sr-fallback-ring-primary: #2f6fed;
        --sr-fallback-radius-md: 6px;
        --sr-fallback-shadow-sm: 0 1px 2px rgba(15, 17, 21, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --sr-fallback-bg-primary: #1c1d21;
          --sr-fallback-bg-secondary: #26272c;
          --sr-fallback-text-primary: #edeef0;
          --sr-fallback-text-secondary: #b7bac0;
          --sr-fallback-text-tertiary: #888d95;
          --sr-fallback-border-primary: #3a3c42;
          --sr-fallback-border-warning: #caa24d;
          --sr-fallback-ring-primary: #6d97f7;
          --sr-fallback-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        }
      }
      * {
        box-sizing: border-box;
      }
      /* The [hidden] attribute is author-overridable by any later
         display rule of equal or lower origin; without this the flex
         rule below would make a hidden list visible. */
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--color-background-primary, var(--sr-fallback-bg-primary));
        color: var(--color-text-primary, var(--sr-fallback-text-primary));
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
        font-size: 13px;
        line-height: 1.5;
      }
      .search-results__status {
        margin: 0 0 12px;
        white-space: normal;
        font-family: inherit;
      }
      .search-results__status--message {
        padding: 8px 10px;
        border-left: 3px solid
          var(--color-border-warning, var(--sr-fallback-border-warning));
        background: var(--color-background-secondary, var(--sr-fallback-bg-secondary));
        border-radius: var(--border-radius-md, var(--sr-fallback-radius-md));
      }
      .search-results__list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .search-results__row {
        padding: 8px 10px;
        border: 1px solid var(--color-border-primary, var(--sr-fallback-border-primary));
        border-radius: var(--border-radius-md, var(--sr-fallback-radius-md));
        background: var(--color-background-secondary, var(--sr-fallback-bg-secondary));
        box-shadow: var(--shadow-sm, var(--sr-fallback-shadow-sm));
        cursor: pointer;
      }
      .search-results__row:hover,
      .search-results__row:focus-visible {
        outline: 2px solid var(--color-ring-primary, var(--sr-fallback-ring-primary));
        outline-offset: 1px;
      }
      .search-results__row-path {
        display: block;
        font-weight: 600;
        word-break: break-word;
      }
      .search-results__row-excerpt {
        margin: 4px 0 0;
        color: var(--color-text-secondary, var(--sr-fallback-text-secondary));
        word-break: break-word;
      }
      .search-results__row-meta {
        display: flex;
        /* A heading is vault content and can be long. Without wrapping,
           the flex line cannot break and the row overflows sideways. */
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 4px;
        font-size: 0.9em;
        color: var(--color-text-tertiary, var(--sr-fallback-text-tertiary));
      }
      /* A flex item refuses to shrink below its content's intrinsic width
         unless min-width is cleared, so wrapping alone does not save a
         heading that is one unbroken token. */
      .search-results__row-heading {
        min-width: 0;
        word-break: break-word;
      }
      .search-results__row-path-reveal {
        display: block;
        margin-top: 6px;
        user-select: all;
        word-break: break-word;
        color: var(--color-text-tertiary, var(--sr-fallback-text-tertiary));
      }
      .search-results__truncated {
        margin: 8px 0 0;
        font-size: 0.9em;
        color: var(--color-text-tertiary, var(--sr-fallback-text-tertiary));
      }
    </style>
  </head>
  <body>
    <pre id="output" class="search-results__status">waiting for a tool result…</pre>
    <ul id="results-list" class="search-results__list" hidden></ul>
    <p id="truncated-note" class="search-results__truncated" hidden></p>
    <script type="module">__MCP_APPS_BUNDLE_SOURCE__</script>
  </body>
</html>
