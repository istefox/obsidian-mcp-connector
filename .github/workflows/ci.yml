name: CI

# On-PR validation. `check-and-test` (ubuntu) is typecheck +
# bundle build-smoke + every test suite, the stdlib Python one for the Windows
# bridge included; `bridge-tests` runs that Python suite a second time on
# windows-latest, where its bug actually lived; `discovery-broker-tests` runs
# the broker's focused contract on all three desktop operating systems. Runs on
# every push to main and on every PR targeting
# main. The build step here is a smoke
# check that catches a non-buildable bundle (e.g. Svelte/patch version
# drift — #150). release.yml stays separate (tag-triggered) and owns
# the release build: release env + zip + upload + attestation.
#
# CI does NOT exercise the manual smoke matrix (vault TEST + Claude
# Code + Claude Desktop + Cursor/Cline) — that is reserved for
# pre-release validation per the design § Testing strategy.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel an older in-flight run for the same ref when a new push lands.
# A redundant test run on a stale commit is wasted CI time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Format check (prettier)
        run: bun run format:check

      - name: Typecheck (workspace-wide)
        run: bun run check

      - name: Typecheck (Svelte)
        run: cd packages/obsidian-plugin && bun run check:svelte

      - name: Build (bundle smoke)
        run: bun run build

      # The two steps below cd into a package, so a test file at the REPO root
      # runs in neither of them. scripts/version.test.ts is the first one, and
      # this is the same trap the Python bridge suite sat in. The path filter
      # also re-matches the two suites under packages/*/scripts/, which costs
      # about a second and is not worth engineering around.
      - name: Tests — root scripts
        run: bun test scripts/

      - name: Tests — shared
        run: cd packages/shared && bun test

      - name: Tests — obsidian-plugin
        run: cd packages/obsidian-plugin && bun test

      # A step in THIS job, not a job of its own: `check-and-test` is the only
      # required status check on main, so a separate job would run and report
      # while merging anyway — which is the very "discipline rather than
      # enforcement" gap this closes (OMC-033). The bridge is stdlib-only, so
      # the runner's own python3 is enough and there is nothing to install.
      - name: Tests — Windows bridge (Python, stdlib only)
        run: python3 -m unittest discover -s scripts -v

      - name: .mcpb bundle smoke (both loaders, #412 regression guard)
        run: cd packages/obsidian-plugin && bun run test:mcpb

  # The bridge suite ALSO runs on Windows, because that is the only OS its bug
  # ever appeared on: Python opens sys.stdin/sys.stdout with the locale
  # codepage there, so UTF-8 bytes arrive mangled (OMC-033, fixed in 2.0.1).
  #
  # What this leg proves and what it does not. The four ForceUtf8StdioTests
  # assert the reconfigure CALL against a recording stream, deliberately, so
  # they are platform-independent and a green Windows run does NOT prove that
  # `ø` survives a real round-trip on a cp1252 console. What it does prove is
  # that the suite executes on Windows at all — the interpreter, the discovery
  # and every path assumption in it — which nothing checked before.
  #
  # A job rather than a step, unavoidably: `check-and-test` is ubuntu-latest,
  # and one job has one runner. That means this is only an enforcement once
  # `bridge-tests` is in main's required-status-checks list (classic branch
  # protection, which carried `check-and-test` alone).
  #
  # Python is pinned rather than taken from the runner image on purpose: a
  # required check must not go red for every PR because GitHub bumped its
  # preinstalled interpreter. The cost is that only this one version is
  # covered; the OS axis is what this job buys.
  bridge-tests:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Tests — Windows bridge (Python, stdlib only)
        run: python -m unittest discover -s scripts -v

  # The discovery broker owns files, sockets, and a detached Node.js process.
  # Run its focused contract on every supported desktop operating system.
  discovery-broker-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Tests — discovery broker
        run: bun test packages/obsidian-plugin/scripts/discoveryBroker.test.ts packages/obsidian-plugin/src/features/mcp-client-config/services/codexConfig.test.ts packages/obsidian-plugin/src/features/mcp-client-config/services/discoveryBroker.test.ts packages/obsidian-plugin/src/features/mcp-client-config/services/nodeDetect.test.ts
