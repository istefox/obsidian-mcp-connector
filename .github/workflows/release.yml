name: Release

# The tag filter stays broad ON PURPOSE, and the enforcement lives in the first
# step of the job instead (#481). Narrowing this glob would be the obvious fix
# and is the wrong one: GitHub's filter-pattern semantics are not the shell's,
# and a pattern that is too strict means a REAL release silently never publishes
# — discovered at the next cut, which is worse than the problem being solved. A
# bash guard fails in the safe direction: a non-version tag produces a red run
# and no release, while every version tag always reaches the job.
on:
  push:
    tags:
      - "*"
    branches:
      - main

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # FIRST, before checkout and before anything can be built or published.
      # Every step below this one assumes the tag names a release; this is what
      # makes that true (#481). Until it existed, `git push origin <any-tag>`
      # published a real release named after that tag, built from whatever
      # commit it pointed at, with no confirmation anywhere — the draft below
      # exists only to attach assets and the last step promotes it.
      #
      # `ref_name` goes through `env`, never interpolated into the script: a ref
      # name is attacker-influenceable text and `${{ }}` splices it in before
      # bash ever sees it.
      #
      # The pattern was checked against all 98 tags this repo has ever pushed,
      # prereleases included (`0.4.0-alpha.1`, `0.4.0-beta.3`); all 98 match.
      # `v`-prefixed tags are refused because this project has never used one —
      # adopting that scheme should fail loudly here rather than half-work.
      - name: Refuse a tag that does not name a release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Refusing to publish: the tag '$TAG' is not a release version (expected MAJOR.MINOR.PATCH, optionally -prerelease). Nothing was built and no release was created. Delete the tag if it was a mistake, or use a custom ref such as refs/archive/<name> for anything that is not a release."
            exit 1
          fi
          echo "Tag '$TAG' names a release. Continuing."

      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build plugin
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bun --filter '@obsidian-mcp-tools/obsidian-plugin' release

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: main.js

      # Community-verified attestation recipe ordering
      # (forum.obsidian.md/t/114445): the attestation must exist BEFORE the
      # release object is created. The release is still created as a draft and
      # published as a separate last step because this repository enforces
      # release immutability — a non-draft release locks its assets at
      # publication, so assets must be attached while still in draft.
      - name: Create Release with artifacts
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: true
          # Pre-release tags carry a SemVer suffix with a hyphen
          # (`0.7.0-beta.1`, `-rc.1`, `-alpha.2`). Mark those prerelease
          # so GitHub does NOT move `/releases/latest` to them — otherwise
          # the community store + BRAT-default users would pull an
          # unfinished beta as "latest". Stable tags (`0.6.0`) have no
          # hyphen, so prerelease resolves to false.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # styles.css intentionally omitted — Svelte 5 inlines component CSS into main.js.
          # No .mcpb here, on purpose (ADR-0013, "Addendum (2.0.2)"): a bundle built by
          # CI has no vault path and no token id to carry, so the only correct one is
          # the per-token export from inside Obsidian. The body below says where.
          files: |
            main.js
            manifest.json
          body: |
            ---
            **Claude Desktop:** the `.mcpb` extension is exported from inside Obsidian — **Settings → MCP Connector → Access control**, then `.mcpb` on your token's row. It is not attached here: a bundle built by CI has no vault path and no token id to carry.

            ✨ This release includes attested build artifacts.
            📝 View attestation details in the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
